// Current checkout's status (ext.gitStatus), based on buildinfra's gitinfo extension,
// plus a sanity check of submodule states. All values are providers evaluated lazily,
// so this is compatible with the configuration cache.

def gitInfo = rootProject.gitinfo.gitInfo

def branch = providers.exec {
  commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
}.standardOutput.asText.map { it.trim() }

def submoduleStatus = providers.exec {
  commandLine 'git', 'submodule', 'status'
}.standardOutput.asText

def status = [
  fullRev: gitInfo.getting("git.commit").get(),
  abbrRev: gitInfo.getting("git.commit-short").get(),
  clean : Boolean.parseBoolean(gitInfo.getting("git.clean").get()),
  branch : branch.get(),
]
status.id = status.branch + "/" + status.abbrRev + (status.clean ? "" : "-dirty")

if (!status.clean) {
  // Changed files are reported in git's porcelain v2 format; keep the paths only.
  def changedFiles = gitInfo.getting("git.changed-files").get().readLines()
      .findAll { !it.isBlank() }
      .collect { it.split(/\s+/).last() }
  logger.warn("Git status indicates dirty checkout, changed files: {}", changedFiles)
}

// Fail on suspicious submodule states ('-' not initialized, 'U' conflicts, '+' a commit
// other than the recorded one - allowed in development mode).
gradle.taskGraph.whenReady { graph ->
  submoduleStatus.get().readLines().findAll { !it.isBlank() }.each { line ->
    def type = line.charAt(0)
    def path = line.substring(1).trim().split(/\s+/)[1]
    if (type == '+' && rootProject.ext.devMode) {
      return
    }
    if (type != ' ') {
      throw new GradleException("Suspicious submodule status: ${path} '${type}'")
    }
  }
}

ext.gitStatus = status
