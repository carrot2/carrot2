// Per-project test summary.

allprojects {
  tasks.withType(Test).configureEach { task ->
    def taskPath = task.path
    addTestListener(new TestListener() {
          void beforeSuite(TestDescriptor desc) {}
          void beforeTest(TestDescriptor desc) {}
          void afterTest(TestDescriptor desc, TestResult result) {}

          void afterSuite(TestDescriptor desc, TestResult result) {
            if (!desc.parent) {
              if (result.testCount> 0) {
                def components = [
                  "test(s)" : result.testCount,
                  "failure(s)": result.failedTestCount,
                  "skipped" : result.skippedTestCount
                ].findAll { k, v ->
                  v> 0
                }.collect { k, v ->
                  "$v $k"
                }.join(", ")

                logger.lifecycle("${taskPath} (${result.resultType}): ${components}")
              }
            }
          }
        })
  }
}
