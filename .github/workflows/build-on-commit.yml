name: Build and test (on commits and PRs)

on:
  workflow_dispatch:
    # Allow manual dispatch.

  pull_request:
    branches:
      - master

  push:
    branches:
      - master
      - bugfix/4.4.x

# The build only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: run checks

    # Check on latest ubuntu with the lowest supported JDK. Everything else
    # is handled by subsequent nightly tests.
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        jdk-version: [ '21' ]

    uses: $/.github/workflows/build-and-test.yml
    with:
      gradle-options:
      os: ${{ matrix.os }}
      jdk-version: ${{ matrix.jdk-version }}
    secrets:
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
