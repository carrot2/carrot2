version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    commit-message:
      prefix: deps(ghactions)
    schedule:
      interval: "weekly"
    labels: [dependencies]
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps(java)
    labels: [dependencies]
    cooldown:
      default-days: 7
    groups:
      java-deps:
        patterns: ["*"]
