plugins {
  id('java-library')
}

configurations {
  distribution
  distributionZip
}

dependencies {
  distribution project(path: ":distribution", configuration: "distDirArtifact")
  distributionZip project(path: ":distribution", configuration: "distZipArtifact")

  testImplementation project(path: ":infra:tests")
  testImplementation libs.commons.compress
  testImplementation libs.carrotsearch.procfork
  testImplementation libs.carrotsearch.console.launcher
  testImplementation libs.carrotsearch.progresso.core
}

// progresso requires Java 25. This only affects the test code: the distribution
// is forked using java from PATH/JAVA_HOME and doesn't ship progresso.
tasks.withType(JavaCompile).configureEach {
  javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
}

test {
  javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }

  dependsOn configurations.distributionZip

  shouldRunAfter ":core:test"

  maxParallelForks = 2

  doFirst {
    def distZip = configurations.distributionZip.singleFile
    systemProperty("distribution.zip", distZip)
    systemProperty("tests.slow", "true")

    logger.lifecycle("Integration tests of: ${distZip}")
  }
}
